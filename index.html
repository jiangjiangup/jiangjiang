<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jiangjiang 的github学习主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #0f172a, #1d4ed8 55%, #0891b2);
    }

    main {
      width: min(90%, 680px);
      padding: 48px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(15, 23, 42, 0.55);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      color: #1d4ed8;
      background: #f8fafc;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-weight: bold;
      text-decoration: none;
      border-radius: 999px;
      background: #ffffff;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.3);
    }
    @media (max-width: 600px) {
  main {
    width: 92%;
    padding: 32px 20px;
  }

  h1 {
    font-size: 32px;
  }

  p {
    font-size: 16px;
  }
}
  </style>
</head>
<body>
  <main>
    <h1>你好，我是 jiangjiang 👋</h1>
    <p>欢迎来到我的第一个 GitHub Pages 网站。</p>
    <p>我正在学习 GitHub、分支、Commit 和 Pull Request。</p>
    <section>
  <h2>关于这个项目</h2>
  <p>这是我的 GitHub 学习项目，用来练习分支、Commit、Pull Request 和 GitHub Pages。</p>
</section>

<p>
  <a href="https://github.com/jiangjiangup/jiangjiang" target="_blank" rel="noopener noreferrer">
    查看这个项目的 GitHub 仓库
  </a>
</p>
  </main>
  <footer>
  <p>© 2026 jiangjiangup</p>
  </footer>
</body>
</html>
