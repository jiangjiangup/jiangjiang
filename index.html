<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jiangjiang 的github学习主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    main {
      width: min(90%, 680px);
      padding: 48px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }
    <p>这是一行用于练习撤销的临时文字。</p>
    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      color: #4338ca;
      font-weight: bold;
      text-decoration: none;
      border-radius: 999px;
      background: #ffffff;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是 jiangjiang 👋</h1>
    <p>欢迎来到我的第一个 GitHub Pages 网站。</p>
    <p>我正在学习 GitHub、分支、Commit 和 Pull Request。</p>
    <section>
  <h2>关于这个项目</h2>
  <p>这是我的 GitHub 学习项目，用来练习分支、Commit、Pull Request 和 GitHub Pages。</p>
</section>

<p>
  <a href="https://github.com/jiangjiangup/jiangjiang" target="_blank" rel="noopener noreferrer">
    查看这个项目的 GitHub 仓库
  </a>
</p>
  </main>
</body>
</html>
